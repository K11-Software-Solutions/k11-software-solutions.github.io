<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QA Lead / Architect Interview Prep - TypeScript Track</title>
<style>
  :root {
    --bg: #10141c;
    --surface: #171d29;
    --surface-2: #222b3b;
    --border: #334055;
    --text: #eef4ff;
    --muted: #a9b6ca;
    --accent: #4db4ff;
    --accent-2: #8fd0ff;
    --good: #65dc9b;
    --warn: #f0bd57;
    --bad: #ff6b78;
    --code-bg: #0b1018;
    --radius: 8px;
    --shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Arial, sans-serif;
    line-height: 1.55;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 18px 28px;
    background: linear-gradient(135deg, #14304b 0%, #235a8d 55%, #2c6da6 100%);
    border-bottom: 1px solid var(--border);
  }

  header h1 {
    margin: 0;
    font-size: 20px;
    letter-spacing: 0;
  }

  header small {
    display: block;
    color: #dff2ff;
    font-size: 13px;
    font-weight: 400;
    margin-top: 2px;
  }

  button, input { font: inherit; }

  .progress-pill {
    flex: 0 0 auto;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.14);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    padding: 7px 14px;
  }

  .layout {
    display: grid;
    grid-template-columns: 300px minmax(0, 1fr);
    min-height: calc(100vh - 74px);
  }

  nav {
    position: sticky;
    top: 74px;
    height: calc(100vh - 74px);
    overflow-y: auto;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 16px 12px;
  }

  .search {
    width: 100%;
    margin-bottom: 14px;
    padding: 9px 11px;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    outline: none;
  }

  .search:focus { border-color: var(--accent); }

  .label {
    margin: 4px 8px 10px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
  }

  .topic-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    margin-bottom: 4px;
    padding: 10px 12px;
    color: var(--text);
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--radius);
    cursor: pointer;
    text-align: left;
  }

  .topic-btn:hover { background: var(--surface-2); }
  .topic-btn.active { background: var(--surface-2); border-color: var(--accent); }

  .topic-btn .num {
    min-width: 28px;
    padding: 2px 8px;
    color: var(--accent-2);
    background: rgba(77, 180, 255, 0.16);
    border-radius: 6px;
    font-size: 12px;
    font-weight: 800;
    text-align: center;
  }

  .topic-btn.done .num {
    color: var(--good);
    background: rgba(101, 220, 155, 0.18);
  }

  main {
    max-width: 1120px;
    min-width: 0;
    padding: 26px 32px 60px;
    overflow-x: hidden;
  }

  .topic-title {
    margin: 0 0 4px;
    font-size: 26px;
  }

  .topic-sub {
    margin-bottom: 18px;
    color: var(--muted);
    font-size: 14px;
  }

  .summary-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 22px;
    padding: 14px 18px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }

  .stats {
    color: var(--muted);
    font-size: 13px;
  }

  .stats strong { color: var(--text); }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 22px;
    overflow-x: auto;
    border-bottom: 1px solid var(--border);
  }

  .tab-btn {
    padding: 10px 16px;
    color: var(--muted);
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    white-space: nowrap;
  }

  .tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    font-weight: 800;
  }

  .notes p { margin: 0 0 12px; }
  .notes h3 { margin: 22px 0 8px; color: var(--accent-2); font-size: 17px; }
  .notes ul { margin: 0 0 14px; padding-left: 22px; }
  .notes li { margin-bottom: 6px; }
  code { color: #9cdcfe; }

  .callout {
    margin: 14px 0;
    padding: 12px 14px;
    background: rgba(77, 180, 255, 0.09);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
  }

  .callout strong { color: var(--accent-2); }

  .roadmap-intro,
  .roadmap-level,
  .flashcard,
  .quiz-q,
  .mock-q,
  .code-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  .roadmap-intro {
    margin-bottom: 18px;
    padding: 16px 20px;
    background: linear-gradient(135deg, rgba(20, 48, 75, 0.68), rgba(44, 109, 166, 0.28));
  }

  .roadmap-level {
    margin-bottom: 16px;
    padding: 18px 22px;
  }

  .level-label {
    display: inline-block;
    margin-bottom: 10px;
    padding: 4px 12px;
    color: #dff2ff;
    background: linear-gradient(135deg, #14304b, #235a8d);
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.1px;
    text-transform: uppercase;
  }

  .when {
    margin-bottom: 12px;
    color: var(--muted);
    font-size: 13.5px;
    font-style: italic;
  }

  .roadmap-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
    margin-top: 12px;
  }

  .roadmap-block {
    padding: 12px 14px;
    background: var(--surface-2);
    border-radius: var(--radius);
  }

  .roadmap-block h4 {
    margin: 0 0 8px;
    color: var(--accent-2);
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .tag-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .tag {
    padding: 3px 9px;
    color: var(--accent-2);
    background: rgba(77, 180, 255, 0.12);
    border-radius: 999px;
    font-size: 12px;
  }

  .resource-link {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
    padding: 7px 10px;
    color: var(--text);
    text-decoration: none;
    border-radius: 6px;
  }

  .resource-link:hover {
    color: var(--accent-2);
    background: rgba(77, 180, 255, 0.10);
  }

  .pill {
    flex: 0 0 auto;
    padding: 2px 7px;
    color: var(--muted);
    background: var(--bg);
    border-radius: 4px;
    font-size: 10px;
    letter-spacing: .6px;
    text-transform: uppercase;
  }

  .flash-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }

  .counter { color: var(--muted); font-size: 13px; }

  .flashcard {
    margin-bottom: 16px;
    padding: 24px 28px;
    cursor: pointer;
  }

  .flashcard:hover { border-color: var(--accent); }

  .flashcard .flag {
    margin-bottom: 10px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
  }

  .flashcard .q {
    font-size: 16px;
    font-weight: 800;
  }

  .flashcard .a {
    display: none;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px dashed var(--border);
    font-size: 14.5px;
  }

  .flashcard.flipped .a { display: block; }
  .flashcard.flipped .flag { color: var(--good); }

  .quiz-q,
  .mock-q {
    margin-bottom: 16px;
    padding: 18px 22px;
  }

  .qtext {
    margin-bottom: 12px;
    font-weight: 800;
  }

  .opt {
    display: block;
    margin-bottom: 7px;
    padding: 10px 14px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
  }

  .opt:hover { border-color: var(--accent); }
  .opt.correct { background: rgba(101, 220, 155, 0.13); border-color: var(--good); }
  .opt.wrong { background: rgba(255, 107, 120, 0.11); border-color: var(--bad); }

  .explanation {
    display: none;
    margin-top: 10px;
    padding: 10px 14px;
    background: rgba(240, 189, 87, 0.09);
    border-left: 3px solid var(--warn);
    border-radius: 6px;
    font-size: 13.5px;
  }

  .quiz-q.answered .explanation { display: block; }

  .label-q {
    margin-bottom: 6px;
    color: var(--accent-2);
    font-size: 11px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
  }

  .question {
    margin-bottom: 10px;
    font-size: 15.5px;
    font-weight: 800;
  }

  details { margin-top: 8px; }

  summary {
    color: var(--accent);
    cursor: pointer;
    font-size: 13px;
  }

  .answer-body {
    margin-top: 10px;
    padding: 12px 14px;
    background: var(--surface-2);
    border-radius: var(--radius);
    font-size: 14px;
  }

  .answer-body p { margin: 0 0 8px; }

  .tips {
    margin-top: 8px;
    padding-left: 10px;
    color: var(--muted);
    border-left: 2px solid var(--warn);
    font-size: 13px;
  }

  .code-block {
    margin-bottom: 18px;
    overflow: hidden;
  }

  .ctitle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
    font-weight: 800;
  }

  .lang-tag {
    padding: 2px 8px;
    color: var(--accent-2);
    background: rgba(77, 180, 255, 0.15);
    border-radius: 4px;
    font-size: 11px;
    text-transform: uppercase;
  }

  pre {
    margin: 0;
    padding: 16px 18px;
    overflow-x: auto;
    color: #e6edf3;
    background: var(--code-bg);
    font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
    font-size: 13px;
    line-height: 1.55;
  }

  .desc {
    padding: 12px 16px;
    color: var(--muted);
    background: var(--surface);
    border-top: 1px solid var(--border);
    font-size: 13px;
  }

  .btn {
    padding: 8px 14px;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 13px;
  }

  .btn:hover { border-color: var(--accent); }

  .btn-primary {
    color: #07111c;
    background: var(--accent);
    border-color: var(--accent);
    font-weight: 800;
  }

  .btn-primary:hover { background: var(--accent-2); }

  .empty {
    padding: 18px;
    color: var(--muted);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
  }

  @media (max-width: 860px) {
    header { position: static; align-items: flex-start; flex-direction: column; }
    .layout { grid-template-columns: 1fr; }
    nav {
      position: static;
      height: auto;
      max-height: 45vh;
      border-right: none;
      border-bottom: 1px solid var(--border);
    }
    main { padding: 18px; }
    .roadmap-grid { grid-template-columns: 1fr; }
    .summary-bar, .flash-controls { align-items: stretch; flex-direction: column; }
  }
</style>
</head>
<body>
<header>
  <h1>QA Lead / Architect Interview Prep
    <small>TypeScript track: strict typing, Playwright, API contracts, runners, CI/CD, and architecture</small>
  </h1>
  <div class="progress-pill" id="progressPill">Topic 1 of 10</div>
</header>

<div class="layout">
  <nav>
    <input id="searchBox" class="search" type="search" placeholder="Search TypeScript topics">
    <div class="label">Topics to revise</div>
    <div id="topicNav"></div>
  </nav>
  <main id="main"></main>
</div>

<script>
const TOPICS = [
  {
    id: "ts-foundations",
    title: "TypeScript foundations",
    subtitle: "Why TypeScript matters for QA architecture and how it differs from JavaScript.",
    notes: `
      <p>TypeScript is JavaScript with a static type system. For QA automation, the biggest value is not clever types; it is safer framework code, reliable refactors, typed API contracts, and better onboarding for large suites.</p>
      <h3>Must know cold</h3>
      <ul>
        <li>Type annotations, inference, interfaces, type aliases, unions, intersections, and literal types.</li>
        <li><code>unknown</code> vs <code>any</code>, and why <code>any</code> should be rare in shared framework code.</li>
        <li>Optional properties, nullability, strict mode, and control-flow narrowing.</li>
        <li>Classes, access modifiers, readonly, generics, utility types, and modules.</li>
        <li>TypeScript types are erased at runtime, so external data still needs validation.</li>
      </ul>
      <h3>Lead-level review signals</h3>
      <ul>
        <li>Use strict mode for framework packages when possible.</li>
        <li>Model domain values with unions instead of loose strings.</li>
        <li>Use <code>unknown</code> for untrusted input, then narrow or validate.</li>
        <li>Keep types readable. A test author should not need a type-system PhD to add a test.</li>
      </ul>
      <div class="callout"><strong>Interview signal:</strong> TypeScript catches internal contract mistakes before tests run, but it does not validate JSON from an API unless you add runtime checks.</div>
    `,
    roadmap: [
      ["Beginner", "Goal: write typed helpers and understand strict-mode errors.", ["Types", "Interfaces", "Unions", "Optional properties", "Narrowing", "Modules", "tsconfig"], [["TypeScript Handbook", "https://www.typescriptlang.org/docs/handbook/intro.html", "docs"], ["Total TypeScript beginner material", "https://www.totaltypescript.com/tutorials/beginners-typescript", "tutorial"]], [["TypeScript Exercises", "https://typescript-exercises.github.io/"], ["Exercism TypeScript", "https://exercism.org/tracks/typescript"]]],
      ["Intermediate", "Goal: build typed API clients, fixtures, and page objects.", ["Generics", "Utility types", "Discriminated unions", "Zod", "Playwright fixtures", "Vitest", "ESM"], [["Playwright TypeScript docs", "https://playwright.dev/docs/test-typescript", "docs"], ["Zod docs", "https://zod.dev/", "docs"], ["Vitest with TypeScript", "https://vitest.dev/guide/", "docs"]], [["Build a typed API client", "https://zod.dev/"], ["Convert a JS Playwright suite to TS", "https://playwright.dev/docs/test-typescript"]]],
      ["Advanced", "Goal: architect a large TypeScript automation platform.", ["Project references", "Monorepos", "Shared packages", "Contract testing", "Code generation", "CI sharding", "Strict migration"], [["TypeScript project references", "https://www.typescriptlang.org/docs/handbook/project-references.html", "docs"], ["Pact JS", "https://docs.pact.io/implementation_guides/javascript", "docs"], ["OpenAPI TypeScript", "https://openapi-ts.dev/", "docs"]], [["Generate types from OpenAPI", "https://openapi-ts.dev/"], ["Build Playwright CI shards", "https://playwright.dev/docs/test-sharding"]]]
    ],
    flashcards: [
      ["TypeScript vs JavaScript?", "TypeScript adds static types and tooling on top of JavaScript. It compiles to JavaScript and has no runtime type enforcement by itself."],
      ["unknown vs any?", "unknown requires narrowing before use. any disables type safety and should be avoided in shared framework code."],
      ["Interface vs type?", "Interfaces are good for object contracts and extension. Type aliases are flexible for unions, intersections, mapped types, and primitives."],
      ["What is strict mode?", "A set of compiler checks that catches unsafe null access, implicit any, and other risky patterns."],
      ["Why literal unions?", "They restrict values to a known set, such as 'admin' | 'member' | 'viewer', and prevent invalid test data."],
      ["Does TypeScript validate API JSON?", "No. Types are erased at runtime. Use Zod, Ajv, JSON Schema, or explicit checks for external data."]
    ],
    mcqs: [
      ["Best type for untrusted JSON before validation?", ["any", "unknown", "string", "never"], 1, "unknown forces you to validate or narrow before use."],
      ["Best type for user roles?", ["string", "any", "'admin' | 'member' | 'viewer'", "object"], 2, "Literal unions model finite valid values."],
      ["TypeScript runtime validation is automatic?", ["Yes", "No", "Only in Playwright", "Only in Node 20"], 1, "TypeScript checks at compile time; runtime validation needs code or a library."],
      ["Most risky type in shared framework code?", ["readonly", "boolean", "any", "Date"], 2, "any removes compiler protection."]
    ],
    mockQA: [
      ["Why would you choose TypeScript for a QA automation framework?", "I would choose TypeScript because test frameworks become shared production infrastructure. Types catch helper contract bugs before runtime, make API clients safer, improve IDE support, and make large refactors less risky. I still add runtime validation for API responses because TypeScript types disappear at runtime.", "Connect type safety to maintainability and confidence."],
      ["How would you migrate a JavaScript suite to TypeScript?", "I would migrate framework code first: config, fixtures, API clients, and page objects. Then turn on strict checks gradually and convert high-change test areas. I would avoid blocking delivery with a big-bang migration. Each step should reduce real defects or improve refactoring safety.", "Incremental migration is the senior answer."],
      ["What TypeScript mistakes do you watch for in code review?", "Overuse of any, overly clever generic types, unsafe non-null assertions, DTO types that do not match runtime validation, and types so complex that test authors avoid them. I want strong contracts with readable code.", "Shows balanced judgment."]
    ],
    code: [
      ["Literal unions for test data", "typescript", String.raw`type Role = "admin" | "member" | "viewer";

interface UserRequest {
  email: string;
  role: Role;
  active: boolean;
}

function user(overrides: Partial<UserRequest> = {}): UserRequest {
  return {
    email: "test-" + crypto.randomUUID() + "@example.com",
    role: "member",
    active: true,
    ...overrides
  };
}`, "Union types prevent invalid role values in test data."],
      ["Narrow unknown", "typescript", String.raw`function getMessage(error: unknown): string {
  if (error instanceof Error) {
    return error.message;
  }
  return String(error);
}`, "unknown keeps error handling honest without throwing away type safety."]
    ]
  },
  {
    id: "narrowing-modeling",
    title: "Type modeling and narrowing",
    subtitle: "Discriminated unions, guards, utility types, readonly data, and safe assertions.",
    notes: `
      <p>Good TypeScript automation code models the product domain. That means roles, states, feature flags, API variants, and error cases become explicit types instead of loose strings and maps.</p>
      <h3>High-value patterns</h3>
      <ul>
        <li>Discriminated unions for API success/error variants.</li>
        <li>Type guards for narrowing unknown external data.</li>
        <li><code>Partial</code> for builders, <code>Pick</code>/<code>Omit</code> for focused payloads, and <code>Readonly</code> for immutable fixture data.</li>
        <li><code>as const</code> for literal maps and stable constants.</li>
        <li>Typed assertion helpers that produce clear failure messages.</li>
      </ul>
    `,
    roadmap: [],
    flashcards: [
      ["Discriminated union?", "A union where each variant has a shared literal property, such as kind or status, allowing safe narrowing."],
      ["Type guard?", "A function returning value is Type that narrows a value when the condition is true."],
      ["Partial use?", "Make all properties optional, useful for builder overrides."],
      ["Pick/Omit use?", "Create focused types from a larger object shape without duplication."],
      ["as const use?", "Preserve literal types for object and array constants instead of widening to string or number."]
    ],
    mcqs: [
      ["Best model for API result success/error variants?", ["any", "Discriminated union", "string only", "boolean only"], 1, "Discriminated unions make each path explicit and safely narrowed."],
      ["Builder overrides commonly use what utility type?", ["Partial", "Required", "Record only", "never"], 0, "Partial lets tests override only scenario-specific fields."],
      ["Type guard return shape?", ["boolean only", "value is Type", "Promise", "void always"], 1, "value is Type tells TypeScript how to narrow."]
    ],
    mockQA: [
      ["How do you model API success and error responses?", "I use a discriminated union with a literal status or kind field. Tests then handle success and error explicitly, and TypeScript prevents accessing success-only fields on an error response.", "Strong modeling answer."],
      ["How do typed builders improve tests?", "They give realistic defaults, keep tests focused on what is unique, and prevent invalid payloads from compiling. With Partial overrides, the call sites stay short but still typed.", "Connect to readability."],
      ["When can types become harmful?", "When they become more complex than the product behavior they model. If a helper requires advanced type gymnastics to use, I simplify it. Test infrastructure should invite contribution.", "Architect judgment."]
    ],
    code: [
      ["Discriminated union", "typescript", String.raw`type ApiResult =
  | { kind: "success"; id: string; status: "ACTIVE" }
  | { kind: "error"; code: string; message: string };

function expectSuccess(result: ApiResult): string {
  if (result.kind === "error") {
    throw new Error(result.message);
  }
  return result.id;
}`, "The kind field safely narrows each variant."],
      ["Type guard", "typescript", String.raw`interface User {
  id: string;
  email: string;
}

function isUser(value: unknown): value is User {
  return typeof value === "object" &&
    value !== null &&
    "id" in value &&
    "email" in value;
}`, "Use guards at boundaries where runtime data enters typed code."]
    ]
  },
  {
    id: "runtime-validation",
    title: "Runtime validation and API contracts",
    subtitle: "Zod, Ajv, JSON Schema, OpenAPI, generated types, and contract confidence.",
    notes: `
      <p>TypeScript makes internal code safer, but API responses, files, environment variables, and message payloads are untrusted at runtime. Validation closes that gap.</p>
      <h3>Options</h3>
      <ul>
        <li><strong>Zod:</strong> ergonomic schema definitions with inferred TypeScript types.</li>
        <li><strong>Ajv:</strong> fast JSON Schema validation, common for OpenAPI-aligned contracts.</li>
        <li><strong>OpenAPI generators:</strong> generate client types and schemas from source-of-truth specs.</li>
        <li><strong>Pact:</strong> consumer-driven contracts for microservice compatibility.</li>
      </ul>
      <div class="callout"><strong>Lead signal:</strong> Compile-time types protect your framework. Runtime validators protect you from the outside world.</div>
    `,
    roadmap: [],
    flashcards: [
      ["Why runtime validation?", "External data can be wrong even if your TypeScript compiles. Runtime validation catches schema drift."],
      ["Zod benefit?", "One schema validates runtime data and can infer the TypeScript type."],
      ["Ajv benefit?", "Fast JSON Schema validation, useful when schemas come from OpenAPI."],
      ["Generated types risk?", "Generated types are only as trustworthy as the source spec and generation pipeline."],
      ["Contract test purpose?", "Ensure providers continue satisfying consumer expectations before deployment."]
    ],
    mcqs: [
      ["Best tool for runtime validation with inferred TS types?", ["Zod", "ESLint", "Prettier", "ts-node"], 0, "Zod validates runtime data and infers static types."],
      ["OpenAPI generated types guarantee provider behavior?", ["Always", "No, they reflect the spec; provider still needs verification", "Only locally", "Only in Chrome"], 1, "Generated types need contract/integration verification."],
      ["When validate environment variables?", ["After half the tests run", "At startup before tests execute", "Never", "Only manually"], 1, "Fail fast on bad CI config."]

const state = {
  topic: 0,
  tab: "notes",
  flashIndex: 0,
  visited: new Set([0]),
  query: ""
};

const TABS = [
  ["notes", "Notes"],
  ["roadmap", "Roadmap"],
  ["flashcards", "Flashcards"],
  ["mcqs", "MCQs"],
  ["mockQA", "Mock Q&A"],
  ["code", "Code"]
];

function createEl(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (key === "className") node.className = value;
    else if (key === "onclick") node.addEventListener("click", value);
    else if (key === "innerHTML") node.innerHTML = value;
    else node.setAttribute(key, value);
  }
  for (const child of children) {
    if (child == null) continue;
    node.appendChild(typeof child === "string" ? document.createTextNode(child) : child);
  }
  return node;
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function currentTopic() {
  return TOPICS[state.topic];
}

function topicMatches(topic) {
  const query = state.query.trim().toLowerCase();
  if (!query) return true;
  return [topic.title, topic.subtitle, topic.id].join(" ").toLowerCase().includes(query);
}

function switchTopic(index) {
  state.topic = index;
  state.tab = "notes";
  state.flashIndex = 0;
  state.visited.add(index);
  renderAll();
}

function renderNav() {
  const nav = document.getElementById("topicNav");
  nav.innerHTML = "";

  TOPICS.forEach((topic, index) => {
    if (!topicMatches(topic)) return;
    nav.appendChild(createEl("button", {
      className: "topic-btn" + (index === state.topic ? " active" : "") + (state.visited.has(index) ? " done" : ""),
      onclick: () => switchTopic(index)
    },
      createEl("span", { className: "num" }, String(index + 1).padStart(2, "0")),
      createEl("span", null, topic.title)
    ));
  });

  if (!nav.children.length) {
    nav.appendChild(createEl("div", { className: "empty" }, "No matching topics."));
  }

  document.getElementById("progressPill").textContent =
    "Topic " + (state.topic + 1) + " of " + TOPICS.length + " | " + state.visited.size + " viewed";
}

function renderMain() {
  const topic = currentTopic();
  const main = document.getElementById("main");
  main.innerHTML = "";

  if (state.tab === "roadmap" && (!topic.roadmap || !topic.roadmap.length)) state.tab = "notes";

  main.appendChild(createEl("h2", { className: "topic-title" }, topic.title));
  main.appendChild(createEl("div", { className: "topic-sub" }, topic.subtitle));

  const summary = createEl("div", { className: "summary-bar" });
  const roadmapCount = topic.roadmap && topic.roadmap.length ? "<strong>" + topic.roadmap.length + "</strong> roadmap levels | " : "";
  summary.appendChild(createEl("div", {
    className: "stats",
    innerHTML: roadmapCount +
      "<strong>" + topic.flashcards.length + "</strong> flashcards | " +
      "<strong>" + topic.mcqs.length + "</strong> MCQs | " +
      "<strong>" + topic.mockQA.length + "</strong> mock Q&A | " +
      "<strong>" + topic.code.length + "</strong> code snippets"
  }));

  summary.appendChild(createEl("div", null,
    createEl("button", {
      className: "btn",
      onclick: () => {
        if (state.topic > 0) switchTopic(state.topic - 1);
      }
    }, "< Previous"),
    document.createTextNode(" "),
    createEl("button", {
      className: "btn btn-primary",
      onclick: () => {
        if (state.topic < TOPICS.length - 1) switchTopic(state.topic + 1);
      }
    }, "Next topic >")
  ));
  main.appendChild(summary);

  const tabBar = createEl("div", { className: "tabs" });
  TABS.forEach(([id, label]) => {
    if (id === "roadmap" && (!topic.roadmap || !topic.roadmap.length)) return;
    tabBar.appendChild(createEl("button", {
      className: "tab-btn" + (state.tab === id ? " active" : ""),
      onclick: () => {
        state.tab = id;
        state.flashIndex = 0;
        renderMain();
      }
    }, label));
  });
  main.appendChild(tabBar);

  const panels = {
    notes: renderNotes,
    roadmap: renderRoadmap,
    flashcards: renderFlashcards,
    mcqs: renderMcqs,
    mockQA: renderMockQA,
    code: renderCode
  };
  main.appendChild(panels[state.tab](topic));
}

function renderNotes(topic) {
  return createEl("section", { className: "notes", innerHTML: topic.notes });
}

function renderRoadmap(topic) {
  const wrap = createEl("section");
  wrap.appendChild(createEl("div", {
    className: "roadmap-intro",
    innerHTML: "<strong>How to use this roadmap:</strong> start with strict fundamentals, then build a typed UI/API framework with runtime validation and CI gates."
  }));

  topic.roadmap.forEach(([level, when, topics, resources, practice]) => {
    const card = createEl("article", { className: "roadmap-level" });
    card.appendChild(createEl("span", { className: "level-label" }, level));
    card.appendChild(createEl("div", { className: "when" }, when));

    const topicBlock = createEl("div", { className: "roadmap-block" });
    topicBlock.appendChild(createEl("h4", null, "What to learn"));
    const tags = createEl("div", { className: "tag-wrap" });
    topics.forEach(item => tags.appendChild(createEl("span", { className: "tag" }, item)));
    topicBlock.appendChild(tags);
    card.appendChild(topicBlock);

    const grid = createEl("div", { className: "roadmap-grid" });
    grid.appendChild(renderResourceBlock("Read and study", resources));
    grid.appendChild(renderResourceBlock("Practice with code", practice.map(item => [item[0], item[1], "practice"])));
    card.appendChild(grid);
    wrap.appendChild(card);
  });

  return wrap;
}

function renderResourceBlock(title, items) {
  const block = createEl("div", { className: "roadmap-block" });
  block.appendChild(createEl("h4", null, title));
  items.forEach(([label, url, type = "link"]) => {
    block.appendChild(createEl("a", {
      className: "resource-link",
      href: url,
      target: "_blank",
      rel: "noopener noreferrer"
    },
      createEl("span", { className: "pill" }, type),
      document.createTextNode(label)
    ));
  });
  return block;
}

function renderFlashcards(topic) {
  const wrap = createEl("section");
  const index = state.flashIndex;
  const card = topic.flashcards[index];

  wrap.appendChild(createEl("div", { className: "flash-controls" },
    createEl("div", { className: "counter" }, "Card " + (index + 1) + " of " + topic.flashcards.length),
    createEl("div", null,
      createEl("button", {
        className: "btn",
        onclick: () => {
          state.flashIndex = (index - 1 + topic.flashcards.length) % topic.flashcards.length;
          renderMain();
        }
      }, "< Prev"),
      document.createTextNode(" "),
      createEl("button", {
        className: "btn btn-primary",
        onclick: () => {
          state.flashIndex = (index + 1) % topic.flashcards.length;
          renderMain();
        }
      }, "Next >")
    )
  ));

  const flash = createEl("article", {
    className: "flashcard",
    onclick: event => event.currentTarget.classList.toggle("flipped")
  });
  flash.appendChild(createEl("div", { className: "flag" }, "Click to reveal answer"));
  flash.appendChild(createEl("div", { className: "q" }, card[0]));
  flash.appendChild(createEl("div", { className: "a" }, card[1]));
  wrap.appendChild(flash);
  return wrap;
}

function renderMcqs(topic) {
  const wrap = createEl("section");
  topic.mcqs.forEach(([question, options, correct, explanation], qIndex) => {
    const card = createEl("article", { className: "quiz-q" });
    card.appendChild(createEl("div", { className: "qtext" }, (qIndex + 1) + ". " + question));
    options.forEach((option, optIndex) => {
      card.appendChild(createEl("div", {
        className: "opt",
        onclick: () => {
          if (card.classList.contains("answered")) return;
          card.classList.add("answered");
          [...card.querySelectorAll(".opt")].forEach((node, index) => {
            if (index === correct) node.classList.add("correct");
            else if (index === optIndex) node.classList.add("wrong");
          });
        }
      }, String.fromCharCode(65 + optIndex) + ". " + option));
    });
    card.appendChild(createEl("div", {
      className: "explanation",
      innerHTML: "<strong>Why:</strong> " + escapeHtml(explanation)
    }));
    wrap.appendChild(card);
  });
  return wrap;
}

function renderMockQA(topic) {
  const wrap = createEl("section");
  topic.mockQA.forEach(([question, answer, tip], index) => {
    const card = createEl("article", { className: "mock-q" });
    card.appendChild(createEl("div", { className: "label-q" }, "Mock question " + (index + 1)));
    card.appendChild(createEl("div", { className: "question" }, question));
    const details = createEl("details");
    details.appendChild(createEl("summary", null, "Show model answer"));
    const body = createEl("div", { className: "answer-body" });
    body.appendChild(createEl("p", null, answer));
    body.appendChild(createEl("div", { className: "tips", innerHTML: "<strong>Coaching tip:</strong> " + escapeHtml(tip) }));
    details.appendChild(body);
    card.appendChild(details);
    wrap.appendChild(card);
  });
  return wrap;
}

function renderCode(topic) {
  const wrap = createEl("section");
  topic.code.forEach(([title, language, code, desc]) => {
    const block = createEl("article", { className: "code-block" });
    block.appendChild(createEl("div", { className: "ctitle" },
      document.createTextNode(title),
      createEl("span", { className: "lang-tag" }, language)
    ));
    block.appendChild(createEl("pre", null, createEl("code", null, code)));
    block.appendChild(createEl("div", { className: "desc" }, desc));
    wrap.appendChild(block);
  });
  return wrap;
}

function renderAll() {
  renderNav();
  renderMain();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

document.getElementById("searchBox").addEventListener("input", event => {
  state.query = event.target.value;
  renderNav();
});

document.addEventListener("keydown", event => {
  if (["INPUT", "TEXTAREA"].includes(event.target.tagName)) return;
  const topic = currentTopic();
  if (event.key === "ArrowRight" && state.tab === "flashcards") {
    state.flashIndex = (state.flashIndex + 1) % topic.flashcards.length;
    renderMain();
  } else if (event.key === "ArrowLeft" && state.tab === "flashcards") {
    state.flashIndex = (state.flashIndex - 1 + topic.flashcards.length) % topic.flashcards.length;
    renderMain();
  } else if (event.key.toLowerCase() === "j" && state.topic < TOPICS.length - 1) {
    switchTopic(state.topic + 1);
  } else if (event.key.toLowerCase() === "k" && state.topic > 0) {
    switchTopic(state.topic - 1);
  }
});

renderAll();
</script>
</body>
</html>
