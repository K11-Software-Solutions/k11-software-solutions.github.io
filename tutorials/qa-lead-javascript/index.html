<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QA Lead / Architect Interview Prep - JavaScript Track</title>
<style>
  :root {
    --bg: #111318;
    --surface: #191d25;
    --surface-2: #232936;
    --border: #343d4d;
    --text: #f1f5f9;
    --muted: #a3adbd;
    --accent: #f7c948;
    --accent-2: #ffe08a;
    --good: #5ee38b;
    --warn: #f2b84b;
    --bad: #ff6b6b;
    --code-bg: #0d1117;
    --radius: 8px;
    --shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Arial, sans-serif;
    line-height: 1.55;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 18px 28px;
    background: linear-gradient(135deg, #2d3342 0%, #5f4b17 54%, #8a650d 100%);
    border-bottom: 1px solid var(--border);
  }

  header h1 {
    margin: 0;
    font-size: 20px;
    letter-spacing: 0;
  }

  header small {
    display: block;
    color: #fff3c4;
    font-size: 13px;
    font-weight: 400;
    margin-top: 2px;
  }

  button, input { font: inherit; }

  .progress-pill {
    flex: 0 0 auto;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.14);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    padding: 7px 14px;
  }

  .layout {
    display: grid;
    grid-template-columns: 300px minmax(0, 1fr);
    min-height: calc(100vh - 74px);
  }

  nav {
    position: sticky;
    top: 74px;
    height: calc(100vh - 74px);
    overflow-y: auto;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 16px 12px;
  }

  .search {
    width: 100%;
    margin-bottom: 14px;
    padding: 9px 11px;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    outline: none;
  }

  .search:focus { border-color: var(--accent); }

  .label {
    margin: 4px 8px 10px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
  }

  .topic-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    margin-bottom: 4px;
    padding: 10px 12px;
    color: var(--text);
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--radius);
    cursor: pointer;
    text-align: left;
  }

  .topic-btn:hover { background: var(--surface-2); }
  .topic-btn.active { background: var(--surface-2); border-color: var(--accent); }

  .topic-btn .num {
    min-width: 28px;
    padding: 2px 8px;
    color: var(--accent-2);
    background: rgba(247, 201, 72, 0.16);
    border-radius: 6px;
    font-size: 12px;
    font-weight: 800;
    text-align: center;
  }

  .topic-btn.done .num {
    color: var(--good);
    background: rgba(94, 227, 139, 0.18);
  }

  main {
    max-width: 1120px;
    min-width: 0;
    padding: 26px 32px 60px;
    overflow-x: hidden;
  }

  .topic-title {
    margin: 0 0 4px;
    font-size: 26px;
  }

  .topic-sub {
    margin-bottom: 18px;
    color: var(--muted);
    font-size: 14px;
  }

  .summary-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 22px;
    padding: 14px 18px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }

  .stats {
    color: var(--muted);
    font-size: 13px;
  }

  .stats strong { color: var(--text); }

  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 22px;
    overflow-x: auto;
    border-bottom: 1px solid var(--border);
  }

  .tab-btn {
    padding: 10px 16px;
    color: var(--muted);
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    white-space: nowrap;
  }

  .tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    font-weight: 800;
  }

  .notes p { margin: 0 0 12px; }
  .notes h3 { margin: 22px 0 8px; color: var(--accent-2); font-size: 17px; }
  .notes ul { margin: 0 0 14px; padding-left: 22px; }
  .notes li { margin-bottom: 6px; }
  code { color: #ffe08a; }

  .callout {
    margin: 14px 0;
    padding: 12px 14px;
    background: rgba(247, 201, 72, 0.09);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
  }

  .callout strong { color: var(--accent-2); }

  .roadmap-intro,
  .roadmap-level,
  .flashcard,
  .quiz-q,
  .mock-q,
  .code-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  .roadmap-intro {
    margin-bottom: 18px;
    padding: 16px 20px;
    background: linear-gradient(135deg, rgba(45, 51, 66, 0.65), rgba(138, 101, 13, 0.24));
  }

  .roadmap-level {
    margin-bottom: 16px;
    padding: 18px 22px;
  }

  .level-label {
    display: inline-block;
    margin-bottom: 10px;
    padding: 4px 12px;
    color: #fff3c4;
    background: linear-gradient(135deg, #5f4b17, #8a650d);
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.1px;
    text-transform: uppercase;
  }

  .when {
    margin-bottom: 12px;
    color: var(--muted);
    font-size: 13.5px;
    font-style: italic;
  }

  .roadmap-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
    margin-top: 12px;
  }

  .roadmap-block {
    padding: 12px 14px;
    background: var(--surface-2);
    border-radius: var(--radius);
  }

  .roadmap-block h4 {
    margin: 0 0 8px;
    color: var(--accent-2);
    font-size: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .tag-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .tag {
    padding: 3px 9px;
    color: var(--accent-2);
    background: rgba(247, 201, 72, 0.12);
    border-radius: 999px;
    font-size: 12px;
  }

  .resource-link {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
    padding: 7px 10px;
    color: var(--text);
    text-decoration: none;
    border-radius: 6px;
  }

  .resource-link:hover {
    color: var(--accent-2);
    background: rgba(247, 201, 72, 0.10);
  }

  .pill {
    flex: 0 0 auto;
    padding: 2px 7px;
    color: var(--muted);
    background: var(--bg);
    border-radius: 4px;
    font-size: 10px;
    letter-spacing: .6px;
    text-transform: uppercase;
  }

  .flash-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }

  .counter { color: var(--muted); font-size: 13px; }

  .flashcard {
    margin-bottom: 16px;
    padding: 24px 28px;
    cursor: pointer;
  }

  .flashcard:hover { border-color: var(--accent); }

  .flashcard .flag {
    margin-bottom: 10px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
  }

  .flashcard .q {
    font-size: 16px;
    font-weight: 800;
  }

  .flashcard .a {
    display: none;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px dashed var(--border);
    font-size: 14.5px;
  }

  .flashcard.flipped .a { display: block; }
  .flashcard.flipped .flag { color: var(--good); }

  .quiz-q,
  .mock-q {
    margin-bottom: 16px;
    padding: 18px 22px;
  }

  .qtext {
    margin-bottom: 12px;
    font-weight: 800;
  }

  .opt {
    display: block;
    margin-bottom: 7px;
    padding: 10px 14px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
  }

  .opt:hover { border-color: var(--accent); }
  .opt.correct { background: rgba(94, 227, 139, 0.13); border-color: var(--good); }
  .opt.wrong { background: rgba(255, 107, 107, 0.11); border-color: var(--bad); }

  .explanation {
    display: none;
    margin-top: 10px;
    padding: 10px 14px;
    background: rgba(242, 184, 75, 0.09);
    border-left: 3px solid var(--warn);
    border-radius: 6px;
    font-size: 13.5px;
  }

  .quiz-q.answered .explanation { display: block; }

  .label-q {
    margin-bottom: 6px;
    color: var(--accent-2);
    font-size: 11px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
  }

  .question {
    margin-bottom: 10px;
    font-size: 15.5px;
    font-weight: 800;
  }

  details { margin-top: 8px; }

  summary {
    color: var(--accent);
    cursor: pointer;
    font-size: 13px;
  }

  .answer-body {
    margin-top: 10px;
    padding: 12px 14px;
    background: var(--surface-2);
    border-radius: var(--radius);
    font-size: 14px;
  }

  .answer-body p { margin: 0 0 8px; }

  .tips {
    margin-top: 8px;
    padding-left: 10px;
    color: var(--muted);
    border-left: 2px solid var(--warn);
    font-size: 13px;
  }

  .code-block {
    margin-bottom: 18px;
    overflow: hidden;
  }

  .ctitle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
    font-weight: 800;
  }

  .lang-tag {
    padding: 2px 8px;
    color: var(--accent-2);
    background: rgba(247, 201, 72, 0.15);
    border-radius: 4px;
    font-size: 11px;
    text-transform: uppercase;
  }

  pre {
    margin: 0;
    padding: 16px 18px;
    overflow-x: auto;
    color: #e6edf3;
    background: var(--code-bg);
    font-family: "JetBrains Mono", "Fira Code", Consolas, monospace;
    font-size: 13px;
    line-height: 1.55;
  }

  .desc {
    padding: 12px 16px;
    color: var(--muted);
    background: var(--surface);
    border-top: 1px solid var(--border);
    font-size: 13px;
  }

  .btn {
    padding: 8px 14px;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 13px;
  }

  .btn:hover { border-color: var(--accent); }

  .btn-primary {
    color: #15120a;
    background: var(--accent);
    border-color: var(--accent);
    font-weight: 800;
  }

  .btn-primary:hover { background: var(--accent-2); }

  .empty {
    padding: 18px;
    color: var(--muted);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
  }

  @media (max-width: 860px) {
    header { position: static; align-items: flex-start; flex-direction: column; }
    .layout { grid-template-columns: 1fr; }
    nav {
      position: static;
      height: auto;
      max-height: 45vh;
      border-right: none;
      border-bottom: 1px solid var(--border);
    }
    main { padding: 18px; }
    .roadmap-grid { grid-template-columns: 1fr; }
    .summary-bar, .flash-controls { align-items: stretch; flex-direction: column; }
  }
</style>
</head>
<body>
<header>
  <h1>QA Lead / Architect Interview Prep
    <small>JavaScript track: language fundamentals, TypeScript, test runners, Playwright, Cypress, APIs, CI/CD, and leadership</small>
  </h1>
  <div class="progress-pill" id="progressPill">Topic 1 of 10</div>
</header>

<div class="layout">
  <nav>
    <input id="searchBox" class="search" type="search" placeholder="Search JavaScript topics">
    <div class="label">Topics to revise</div>
    <div id="topicNav"></div>
  </nav>
  <main id="main"></main>
</div>

<script>
const TOPICS = [
  {
    id: "core-js",
    title: "JavaScript fundamentals",
    subtitle: "The language details that make or break automation code.",
    notes: `
      <p>JavaScript is a major automation language because modern web apps, Playwright, Cypress, WebdriverIO, Jest, Vitest, Pact, and many API tooling stacks live naturally in Node.js. A QA Lead should understand both browser JavaScript and Node-based test infrastructure.</p>
      <h3>Must know cold</h3>
      <ul>
        <li><strong>Values and types:</strong> primitives, objects, arrays, null, undefined, truthy/falsy behavior.</li>
        <li><strong>Equality:</strong> prefer <code>===</code> and understand coercion when reading older code.</li>
        <li><strong>Scope:</strong> <code>let</code>, <code>const</code>, closures, lexical scope, and module boundaries.</li>
        <li><strong>Objects:</strong> prototypes, classes, destructuring, spread/rest, optional chaining.</li>
        <li><strong>Modules:</strong> ES modules vs CommonJS and how test runners load code.</li>
        <li><strong>Error handling:</strong> try/catch, custom errors, rejected promises, and async stack traces.</li>
      </ul>
      <h3>Lead-level review signals</h3>
      <ul>
        <li>Do not hide async work without <code>await</code>; unawaited promises create false passes and flakes.</li>
        <li>Prefer small typed helpers over broad utility files full of loosely shaped objects.</li>
        <li>Use stable test data builders and clear assertions instead of console logging and eyeballing.</li>
        <li>Keep test code deterministic: no arbitrary sleeps, random shared data, or hidden global state.</li>
      </ul>
      <div class="callout"><strong>Interview signal:</strong> Explain how JS language choices affect reliability in async UI and API test suites.</div>
    `,
    roadmap: [
      ["Beginner", "Goal: read and write clean JS test utilities.", ["Types", "Objects", "Arrays", "Functions", "Modules", "Destructuring", "Promises", "Error handling"], [["MDN JavaScript Guide", "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide", "docs"], ["javascript.info", "https://javascript.info/", "tutorial"]], [["Exercism JavaScript", "https://exercism.org/tracks/javascript"], ["Codewars JavaScript", "https://www.codewars.com/?language=javascript"]]],
      ["Intermediate", "Goal: build maintainable test helpers and suites.", ["async/await", "npm scripts", "ES modules", "Jest/Vitest", "Playwright", "API clients", "Linting", "TypeScript basics"], [["Node.js docs", "https://nodejs.org/en/docs", "docs"], ["Vitest Guide", "https://vitest.dev/guide/", "docs"], ["Playwright docs", "https://playwright.dev/docs/intro", "docs"]], [["Build a Playwright smoke suite", "https://playwright.dev/docs/writing-tests"], ["Build API tests with supertest", "https://github.com/ladjs/supertest"]]],
      ["Advanced", "Goal: architect JS/TS automation at scale.", ["TypeScript strict mode", "fixtures", "parallelism", "mocking", "contract tests", "CI sharding", "monorepos", "observability"], [["TypeScript Handbook", "https://www.typescriptlang.org/docs/handbook/intro.html", "docs"], ["Cypress docs", "https://docs.cypress.io/", "docs"], ["Pact JS", "https://docs.pact.io/implementation_guides/javascript", "docs"]], [["Create a typed API client", "https://www.typescriptlang.org/docs/"], ["Build CI shards for Playwright", "https://playwright.dev/docs/test-sharding"]]]
    ],
    flashcards: [
      ["== vs ===?", "== allows type coercion. === checks value and type without coercion. Test code should almost always use === to avoid surprising passes."],
      ["null vs undefined?", "undefined usually means a value was not assigned or a property is missing. null is an intentional empty value. APIs should treat the distinction deliberately."],
      ["What is a closure?", "A function retaining access to variables from its lexical scope after the outer function has returned."],
      ["Why use const?", "const prevents rebinding and communicates intent. It does not make objects deeply immutable."],
      ["What causes false passes in JS tests?", "Common causes include missing await, swallowed promise rejections, assertions inside callbacks that the test runner does not wait for, and over-broad mocks."],
      ["ESM vs CommonJS?", "ES modules use import/export. CommonJS uses require/module.exports. Mixing them can affect test runner config and package compatibility."]
    ],
    mcqs: [
      ["Best equality operator for most test assertions?", ["==", "===", "=", "typeof"], 1, "=== avoids implicit coercion and makes assertions more deterministic."],
      ["const user = {}; user.name = 'A' does what?", ["Throws always", "Works because object contents can mutate", "Creates a new binding", "Freezes user"], 1, "const prevents rebinding the variable, not mutating the object."],
      ["Most likely source of a JS async false pass?", ["Using ===", "Missing await before an async assertion/action", "Using const", "Using a named function"], 1, "If the runner does not wait for the promise, the test may finish before the check runs."],
      ["Optional chaining helps with what?", ["Loop speed", "Safe nested property access", "Parallelism", "CSS selectors"], 1, "obj?.a?.b avoids throwing when an intermediate value is nullish."]
    ],
    mockQA: [
      ["How would you teach JavaScript to a manual tester moving into automation?", "I would start with core JS, arrays, objects, functions, modules, and async/await. Then I would introduce Playwright or Cypress with one small UI suite and API tests using fetch or supertest. Every week would include code review focused on await usage, clear assertions, selectors, and deterministic data. The goal is a working suite in CI, not syntax memorization.", "Show milestones, code review, and a deliverable."],
      ["What JS language issues create flaky automation?", "The biggest one is unawaited async work. Others are shared module-level state, tests relying on order, random data without cleanup, broad mocks that hide behavior, and timeouts used instead of condition waits. I review for these because they create tests that pass locally and fail in CI.", "Async reliability is the core JavaScript signal."],
      ["How do you keep JS test utilities maintainable?", "I keep helpers small and domain-specific, use TypeScript for stable contracts, avoid global mutable state, and make failure messages useful. If a helper hides important behavior or needs a wiki page to understand it, it is too clever.", "Good framework UX answer."]
    ],
    code: [
      ["Safe async test", "javascript", String.raw`test("user can sign in", async ({ page }) => {
  await page.goto("/login");
  await page.getByLabel("Email").fill("user@test.local");
  await page.getByLabel("Password").fill("secret");
  await page.getByRole("button", { name: "Sign in" }).click();
  await expect(page.getByRole("heading", { name: "Dashboard" })).toBeVisible();
});`, "Every async browser action and assertion is awaited."],
      ["Data builder", "javascript", String.raw`export function user(overrides = {}) {
  return {
    email: "test-" + Date.now() + "@example.com",
    role: "member",
    active: true,
    ...overrides
  };
}`, "Builders keep tests focused on the fields that matter."],
      ["Custom error with context", "javascript", String.raw`class ApiError extends Error {
  constructor(message, { status, body, requestId }) {
    super(message);
    this.status = status;
    this.body = body;
    this.requestId = requestId;
  }
}`, "Context-rich errors make CI failures easier to triage."]
    ]
  },
  {
    id: "async-node",
    title: "Async, event loop, and Node.js",
    subtitle: "Promises, async/await, timers, microtasks, Node runtime, and test reliability.",
    notes: `
      <p>Most JavaScript automation failures are really async coordination failures. A lead does not need to teach V8 internals, but should understand the event loop enough to recognize unsafe test patterns.</p>
      <h3>Core concepts</h3>
      <ul>
        <li>Promises represent future values; rejected promises must be awaited or returned.</li>
        <li><code>async</code> functions always return promises.</li>
        <li>Microtasks, timers, and I/O callbacks can run after a test appears done if not awaited.</li>
        <li>Node.js provides file system, process, path, environment, streams, and child process APIs for test tooling.</li>
        <li>Use explicit timeouts and cancellation for long-running API checks.</li>
      </ul>
    `,
    roadmap: [],
    flashcards: [
      ["What does async function return?", "Always a Promise, even if it returns a plain value."],
      ["Promise.all behavior?", "Runs promises concurrently and rejects as soon as one rejects."],
      ["Promise.allSettled use?", "Collect results from all tasks even if some fail, useful for reporting multiple endpoint checks."],
      ["Why avoid arbitrary setTimeout waits?", "They guess timing. Wait on the condition or event that proves readiness."],
      ["Node env vars?", "Read with process.env, but validate required config before tests run."]
    ],
    mcqs: [
      ["Need to check 100 independent endpoints and report every failure. Best primitive?", ["Promise.allSettled", "One by one only", "setTimeout", "JSON.stringify"], 0, "allSettled lets all checks complete and preserves each result."],
      ["What happens if an async assertion is not awaited?", ["Runner always waits", "Test may pass before assertion runs", "Syntax error", "Browser closes slower"], 1, "Unawaited promises are a classic false-pass source."],
      ["Best way to wait for UI state?", ["Fixed timeout", "Condition/assertion wait", "console.log", "Refresh loop"], 1, "Condition-based waits are deterministic and faster."]
    ],
    mockQA: [
      ["Explain the event loop in a QA interview.", "I would keep it practical: JavaScript runs on a single call stack, and async work is scheduled to run later through promises, timers, or I/O. In tests, that means the runner must be told what to wait for. Missing await or returning nothing from an async callback can create false passes.", "Use test reliability language."],
      ["How debug async flakes?", "I check missing awaits, race between action and assertion, network calls not intercepted, shared state, and test runner timeout settings. Then I add trace/logging around the actual readiness condition rather than raising global timeouts.", "Specific async checklist."],
      ["When use Promise.all vs sequential flow?", "Use Promise.all for independent setup or independent API checks. Keep sequential flow when steps depend on prior state, such as login then checkout. Parallelism should not obscure causality.", "Trade-off answer."]
    ],
    code: [
      ["Collect endpoint failures", "javascript", String.raw`const results = await Promise.allSettled(
  urls.map(url => fetch(url).then(res => ({ url, status: res.status })))
);

const failures = results.filter(result =>
  result.status === "rejected" || result.value.status >= 400
);

expect(failures).toEqual([]);`, "allSettled gives a complete failure list instead of stopping at the first error."],
      ["Validated config", "javascript", String.raw`function requiredEnv(name) {
  const value = process.env[name];
  if (!value) throw new Error("Missing required env var: " + name);
  return value;
}

export const config = {
  apiBase: requiredEnv("QA_API_BASE"),
  webBase: requiredEnv("QA_WEB_BASE")
};`, "Fail fast when CI configuration is incomplete."]
    ]
  },
  {
    id: "typescript",
    title: "TypeScript for QA frameworks",
    subtitle: "Static typing, strict mode, DTOs, fixtures, API clients, and maintainable test code.",
    notes: `
      <p>TypeScript is usually the right default for serious JavaScript automation. It catches broken framework contracts before runtime and makes large suites easier to refactor.</p>
      <h3>High-value TypeScript uses</h3>
      <ul>
        <li>Typed API request/response DTOs.</li>
        <li>Typed page objects, fixtures, and helper function contracts.</li>
        <li>Union types for roles, statuses, environments, and feature flags.</li>
        <li>Strict null checks to catch missing data and optional fields.</li>

function createEl(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);

    if (key === "className") node.className = value;

  for (const child of children) {
    if (child == null) continue;
    node.appendChild(typeof child === "string" ? document.createTextNode(child) : child);
  }
  return node;
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function currentTopic() {
  return TOPICS[state.topic];
}

function topicMatches(topic) {
  const query = state.query.trim().toLowerCase();
  if (!query) return true;
  return [topic.title, topic.subtitle, topic.id].join(" ").toLowerCase().includes(query);
}

function switchTopic(index) {
  state.topic = index;
  state.tab = "notes";
  state.flashIndex = 0;
  state.visited.add(index);
  renderAll();
}

function renderNav() {
  const nav = document.getElementById("topicNav");
  nav.innerHTML = "";

  TOPICS.forEach((topic, index) => {
    if (!topicMatches(topic)) return;
    nav.appendChild(createEl("button", {
      className: "topic-btn" + (index === state.topic ? " active" : "") + (state.visited.has(index) ? " done" : ""),
      onclick: () => switchTopic(index)
    },
      createEl("span", { className: "num" }, String(index + 1).padStart(2, "0")),
      createEl("span", null, topic.title)
    ));
  });

  if (!nav.children.length) {
    nav.appendChild(createEl("div", { className: "empty" }, "No matching topics."));
  }

  document.getElementById("progressPill").textContent =
    "Topic " + (state.topic + 1) + " of " + TOPICS.length + " | " + state.visited.size + " viewed";
}

function renderMain() {
  const topic = currentTopic();
  const main = document.getElementById("main");
  main.innerHTML = "";

  if (state.tab === "roadmap" && (!topic.roadmap || !topic.roadmap.length)) state.tab = "notes";

  main.appendChild(createEl("h2", { className: "topic-title" }, topic.title));
  main.appendChild(createEl("div", { className: "topic-sub" }, topic.subtitle));

  const summary = createEl("div", { className: "summary-bar" });
  const roadmapCount = topic.roadmap && topic.roadmap.length ? "<strong>" + topic.roadmap.length + "</strong> roadmap levels | " : "";
  summary.appendChild(createEl("div", {
    className: "stats",
    innerHTML: roadmapCount +
      "<strong>" + topic.flashcards.length + "</strong> flashcards | " +
      "<strong>" + topic.mcqs.length + "</strong> MCQs | " +
      "<strong>" + topic.mockQA.length + "</strong> mock Q&A | " +
      "<strong>" + topic.code.length + "</strong> code snippets"
  }));

  summary.appendChild(createEl("div", null,
    createEl("button", {
      className: "btn",
      onclick: () => {
        if (state.topic > 0) switchTopic(state.topic - 1);
      }
    }, "< Previous"),
    document.createTextNode(" "),
    createEl("button", {
      className: "btn btn-primary",
      onclick: () => {
        if (state.topic < TOPICS.length - 1) switchTopic(state.topic + 1);
      }
    }, "Next topic >")
  ));
  main.appendChild(summary);

  const tabBar = createEl("div", { className: "tabs" });
  TABS.forEach(([id, label]) => {
    if (id === "roadmap" && (!topic.roadmap || !topic.roadmap.length)) return;
    tabBar.appendChild(createEl("button", {
      className: "tab-btn" + (state.tab === id ? " active" : ""),
      onclick: () => {
        state.tab = id;
        state.flashIndex = 0;
        renderMain();
      }
    }, label));
  });
  main.appendChild(tabBar);

  const panels = {
    notes: renderNotes,
    roadmap: renderRoadmap,
    flashcards: renderFlashcards,
    mcqs: renderMcqs,
    mockQA: renderMockQA,
    code: renderCode
  };
  main.appendChild(panels[state.tab](topic));
}

function renderNotes(topic) {
  return createEl("section", { className: "notes", innerHTML: topic.notes });
}

function renderRoadmap(topic) {
  const wrap = createEl("section");
  wrap.appendChild(createEl("div", {
    className: "roadmap-intro",
    innerHTML: "<strong>How to use this roadmap:</strong> learn the core language, add TypeScript, then build one runnable UI/API suite in CI."
  }));

  topic.roadmap.forEach(([level, when, topics, resources, practice]) => {
    const card = createEl("article", { className: "roadmap-level" });
    card.appendChild(createEl("span", { className: "level-label" }, level));
    card.appendChild(createEl("div", { className: "when" }, when));

    const topicBlock = createEl("div", { className: "roadmap-block" });
    topicBlock.appendChild(createEl("h4", null, "What to learn"));
    const tags = createEl("div", { className: "tag-wrap" });
    topics.forEach(item => tags.appendChild(createEl("span", { className: "tag" }, item)));
    topicBlock.appendChild(tags);
    card.appendChild(topicBlock);

    const grid = createEl("div", { className: "roadmap-grid" });
    grid.appendChild(renderResourceBlock("Read and study", resources));
    grid.appendChild(renderResourceBlock("Practice with code", practice.map(item => [item[0], item[1], "practice"])));
    card.appendChild(grid);
    wrap.appendChild(card);
  });

  return wrap;
}

function renderResourceBlock(title, items) {
  const block = createEl("div", { className: "roadmap-block" });
  block.appendChild(createEl("h4", null, title));
  items.forEach(([label, url, type = "link"]) => {
    block.appendChild(createEl("a", {
      className: "resource-link",
      href: url,
      target: "_blank",
      rel: "noopener noreferrer"
    },
      createEl("span", { className: "pill" }, type),
      document.createTextNode(label)
    ));
  });
  return block;
}

function renderFlashcards(topic) {
  const wrap = createEl("section");
  const index = state.flashIndex;
  const card = topic.flashcards[index];

  wrap.appendChild(createEl("div", { className: "flash-controls" },
    createEl("div", { className: "counter" }, "Card " + (index + 1) + " of " + topic.flashcards.length),
    createEl("div", null,
      createEl("button", {
        className: "btn",
        onclick: () => {
          state.flashIndex = (index - 1 + topic.flashcards.length) % topic.flashcards.length;
          renderMain();
        }
      }, "< Prev"),
      document.createTextNode(" "),
      createEl("button", {
        className: "btn btn-primary",
        onclick: () => {
          state.flashIndex = (index + 1) % topic.flashcards.length;
          renderMain();
        }
      }, "Next >")
    )
  ));

  const flash = createEl("article", {
    className: "flashcard",
    onclick: event => event.currentTarget.classList.toggle("flipped")
  });
  flash.appendChild(createEl("div", { className: "flag" }, "Click to reveal answer"));
  flash.appendChild(createEl("div", { className: "q" }, card[0]));
  flash.appendChild(createEl("div", { className: "a" }, card[1]));
  wrap.appendChild(flash);
  return wrap;
}

function renderMcqs(topic) {
  const wrap = createEl("section");
  topic.mcqs.forEach(([question, options, correct, explanation], qIndex) => {
    const card = createEl("article", { className: "quiz-q" });
    card.appendChild(createEl("div", { className: "qtext" }, (qIndex + 1) + ". " + question));
    options.forEach((option, optIndex) => {
      card.appendChild(createEl("div", {
        className: "opt",
        onclick: () => {
          if (card.classList.contains("answered")) return;
          card.classList.add("answered");
          [...card.querySelectorAll(".opt")].forEach((node, index) => {
            if (index === correct) node.classList.add("correct");
            else if (index === optIndex) node.classList.add("wrong");
          });
        }
      }, String.fromCharCode(65 + optIndex) + ". " + option));
    });
    card.appendChild(createEl("div", {
      className: "explanation",
      innerHTML: "<strong>Why:</strong> " + escapeHtml(explanation)
    }));
    wrap.appendChild(card);
  });
  return wrap;
}

function renderMockQA(topic) {
  const wrap = createEl("section");
  topic.mockQA.forEach(([question, answer, tip], index) => {
    const card = createEl("article", { className: "mock-q" });
    card.appendChild(createEl("div", { className: "label-q" }, "Mock question " + (index + 1)));
    card.appendChild(createEl("div", { className: "question" }, question));
    const details = createEl("details");
    details.appendChild(createEl("summary", null, "Show model answer"));
    const body = createEl("div", { className: "answer-body" });
    body.appendChild(createEl("p", null, answer));
    body.appendChild(createEl("div", { className: "tips", innerHTML: "<strong>Coaching tip:</strong> " + escapeHtml(tip) }));
    details.appendChild(body);
    card.appendChild(details);
    wrap.appendChild(card);
  });
  return wrap;
}

function renderCode(topic) {
  const wrap = createEl("section");
  topic.code.forEach(([title, language, code, desc]) => {
    const block = createEl("article", { className: "code-block" });
    block.appendChild(createEl("div", { className: "ctitle" },
      document.createTextNode(title),
      createEl("span", { className: "lang-tag" }, language)
    ));
    block.appendChild(createEl("pre", null, createEl("code", null, code)));
    block.appendChild(createEl("div", { className: "desc" }, desc));
    wrap.appendChild(block);
  });
  return wrap;
}

function renderAll() {
  renderNav();
  renderMain();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

document.getElementById("searchBox").addEventListener("input", event => {
  state.query = event.target.value;
  renderNav();
});

document.addEventListener("keydown", event => {
  if (["INPUT", "TEXTAREA"].includes(event.target.tagName)) return;
  const topic = currentTopic();
  if (event.key === "ArrowRight" && state.tab === "flashcards") {
    state.flashIndex = (state.flashIndex + 1) % topic.flashcards.length;
    renderMain();
  } else if (event.key === "ArrowLeft" && state.tab === "flashcards") {
    state.flashIndex = (state.flashIndex - 1 + topic.flashcards.length) % topic.flashcards.length;
    renderMain();
  } else if (event.key.toLowerCase() === "j" && state.topic < TOPICS.length - 1) {
    switchTopic(state.topic + 1);
  } else if (event.key.toLowerCase() === "k" && state.topic > 0) {
    switchTopic(state.topic - 1);
  }
});

renderAll();
</script>
</body>
</html>
