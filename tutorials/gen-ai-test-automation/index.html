<script>
const TOPICS = [
  {
    title: "Gen AI Fundamentals for QA",
    subtitle: "What LLMs are, how they reason, and why they change test automation.",
    notes: `
      <p>Generative AI refers to models that produce content - text, code, data - by learning patterns from massive corpora. For QA, the shift is from <em>writing tests</em> to <em>describing intent</em> and letting the model draft, improve, and maintain tests on your behalf.</p>
      <div class="section-head">Must know cold</div>
      <ul>
        <li>LLMs (Large Language Models) predict the next token based on context - they do not "understand" like humans, but they generalise patterns extremely well.</li>
        <li>Key models relevant to QA: <code>GPT-4o</code>, <code>Claude 3.5/4</code>, <code>Gemini 1.5 Pro</code>, <code>Llama 3</code>.</li>
        <li>Temperature controls creativity vs. determinism. For code generation use <code>temperature: 0-0.2</code>; for brainstorming edge cases use <code>0.7-1.0</code>.</li>
        <li>Context window = how much text the model can "see" at once. GPT-4o: 128k tokens; Claude 3: 200k tokens. Important for pasting large test files.</li>
        <li>Hallucination: models confidently produce incorrect output. Always review and run AI-generated tests.</li>
        <li>RAG (Retrieval-Augmented Generation): augmenting prompts with your own docs/schemas to ground responses in your system.</li>
      </ul>
      <div class="section-head">Lead-level review signals</div>
      <ul>
        <li>Treat LLM output as a senior engineer's first draft - useful but requiring review, not production-ready copy-paste.</li>
        <li>Establish team norms: what prompts are approved, what review gates exist before AI-generated tests merge.</li>
        <li>Monitor token costs at scale - 1M tokens/day across a large CI pipeline adds up quickly.</li>
        <li>Choose models based on task: cheap/fast models for syntax checks; premium models for complex test design reasoning.</li>
      </ul>
      <div class="callout info">Interview signal: Be able to explain the difference between a deterministic rule-based test generator and a probabilistic LLM. The first always produces the same output for the same input; the second may vary. This matters for reproducibility.</div>
    `,
    roadmap: roadmap(
      ["Foundational Understanding", ["Know what an LLM is and what differentiates it from classical ML.", "Understand tokens, context windows, and temperature conceptually.", "Have used at least one AI code assistant to generate a test."]],
      ["Applied Usage", ["Regularly use AI to draft test cases, fixtures, and mocks.", "Understand hallucination limits and validate AI output systematically.", "Know when to use frontier vs. open-source models based on cost/quality trade-offs.", "Can explain RAG and have experimented with feeding test schemas to an LLM."]],
      ["Strategic Integration", ["Define an organisation-wide AI testing policy: approved tools, review processes, cost controls.", "Build internal tooling that wraps LLM APIs for consistent test generation.", "Evaluate model trade-offs for different testing tasks and document decisions.", "Keep up with model releases and reevaluate tooling choices quarterly."]]
    ),
    flashcards: [
      { q: "What is temperature in an LLM, and what value should you use for code generation?", a: "Temperature controls randomness. 0 = deterministic, 1 = very creative. For code generation use 0-0.2 for consistent, correct output." },
      { q: "What is a hallucination in an LLM context?", a: "When the model generates plausible-sounding but factually incorrect content - a major risk when trusting AI-generated test assertions." },
      { q: "What is RAG and why is it useful for QA?", a: "Retrieval-Augmented Generation: grounding LLM prompts with your own data (API schemas, test plans) to produce more accurate, domain-specific output." },
      { q: "Name three frontier LLMs relevant to test automation.", a: "GPT-4o, Claude, and Gemini. Each has different context sizes, pricing, and strengths." },
      { q: "Why is context window size important for test automation use cases?", a: "Large test suites, OpenAPI specs, or database schemas may exceed smaller windows. Larger windows can ingest full specs in a single prompt." }
    ],
    mcqs: [
      { q: "Which temperature setting is best for deterministic test code generation?", opts: ["1.0", "0.7", "0.1", "2.0"], ans: 2, explanation: "Low temperature minimises randomness, producing consistent, reliable code output." },
      { q: "What is a key risk of using LLM-generated test assertions without review?", opts: ["Higher token costs", "Slower CI pipelines", "Hallucinations producing incorrect assertions", "Larger file sizes"], ans: 2, explanation: "LLMs can confidently produce wrong assertions. Always run and review generated tests before merging." },
      { q: "RAG improves LLM output by:", opts: ["Increasing temperature", "Injecting your own data/docs into the prompt context", "Fine-tuning the model weights", "Reducing token count"], ans: 1, explanation: "RAG retrieves relevant context and appends it to the prompt so the model reasons about your specific system." }
    ],
    qa: [
      { tag: "Conceptual", q: "How would you explain to a sceptical team lead why Gen AI is worth adopting in test automation?", a: `<p>I'd focus on the productivity multiplier rather than replacement. Gen AI handles the boilerplate - generating test scaffolding, data fixtures, and basic assertions - so engineers spend time on edge-case design, test architecture, and debugging.</p><ul><li>Test case drafting from a user story in seconds vs. 30 minutes manually.</li><li>Instant test data generation for complex schemas.</li><li>Self-healing locators reducing maintenance burden.</li></ul><p>The review overhead is real, but lower than writing from scratch. I'd propose a 2-week pilot with a small team and measure time-to-test-coverage.</p>` },
      { tag: "Risk", q: "What governance guardrails would you put in place before allowing AI-generated tests to merge to main?", a: `<p>Three layers: human code review, CI execution, and a quality check that confirms the tests add meaningful coverage. I would also document AI-assisted tests in commit messages for traceability.</p>` }
    ],
    code: [
      { title: "Basic OpenAI test generation call", desc: "Minimal Python script calling GPT-4o to generate a Playwright test from a user story.", snippet: `<span class="kw">import</span> openai

client = openai.OpenAI()

user_story = <span class="str">"""
As a user I want to log in with valid credentials
so that I can access my dashboard.
"""</span>

response = client.chat.completions.create(
    model=<span class="str">"gpt-4o"</span>,
    temperature=<span class="num">0.1</span>,
    messages=[
        {<span class="str">"role"</span>: <span class="str">"system"</span>, <span class="str">"content"</span>: <span class="str">"You are a senior QA engineer. Generate Playwright TypeScript tests."</span>},
        {<span class="str">"role"</span>: <span class="str">"user"</span>, <span class="str">"content"</span>: <span class="str">f"Generate a Playwright test for: {user_story}"</span>}
    ]
)

<span class="kw">print</span>(response.choices[<span class="num">0</span>].message.content)` }
    ]

  {
    title: "Prompt Engineering for Test Cases",
    subtitle: "Writing prompts that produce high-quality, maintainable test code.",
    notes: `
      <p>Prompt engineering is the craft of composing inputs that reliably elicit the output you need. For QA, a good prompt is the difference between a test that passes on the first run and a hallucinated mess that costs an hour to debug.</p>
      <div class="section-head">Must know cold</div>
      <ul>
        <li><strong>System prompt:</strong> sets the model's role and constraints. Always prime it as a "senior QA engineer" with your framework.</li>
        <li><strong>Few-shot examples:</strong> include 1-2 examples of the test style you want. Models mirror format aggressively.</li>
        <li><strong>Explicit constraints:</strong> "Do not use <code>page.waitForTimeout</code>", "use Page Object Model", "add assertions for every UI state change".</li>
        <li><strong>Chain-of-thought:</strong> ask the model to think step-by-step before producing code. Reduces logical errors in complex tests.</li>
        <li><strong>Output format:</strong> specify the exact output - "return only the TypeScript code block, no explanation".</li>
        <li><strong>Context injection:</strong> paste the relevant component code, API schema, or locators into the prompt to anchor the model.</li>
      </ul>
      <div class="section-head">Lead-level review signals</div>
      <ul>
        <li>Build a prompt library - version-controlled, reusable prompt templates for common tasks.</li>
        <li>Measure prompt quality: track hallucination rate, test pass rate, and review time per AI-generated test.</li>
        <li>Resist over-prompting. A 2000-token prompt with all constraints upfront often outperforms iterative back-and-forth for code tasks.</li>
      </ul>
      <div class="callout">Best practice: Always include the phrase "If you are unsure, say so rather than guessing" in prompts that generate assertions - this reduces confident hallucinations.</div>
    `,

      ["Structured Prompting", ["Uses chain-of-thought to improve complex test logic generation.", "Maintains a reusable prompt template library for common test types.", "Injects API schemas and component code into prompts for grounded output."]],

    ),
    flashcards: [
      { q: "What is a system prompt and why does it matter for test generation?", a: "The system prompt sets the model's persona and constraints before the user message. Priming as a senior QA engineer using your framework improves output quality." },
      { q: "What is chain-of-thought prompting?", a: "Asking the model to reason step-by-step before giving the final answer. It reduces logical errors in complex scenarios." },

let currentTopic = 0;
let currentTab = "notes";
const viewedSet = new Set();
const TAB_KEYS = ["notes", "roadmap", "flashcards", "mcqs", "qa", "code"];
const TAB_LABELS = { notes: "Notes", roadmap: "Roadmap", flashcards: "Flashcards", mcqs: "MCQs", qa: "Mock Q&A", code: "Code" };

function roadmap(l1, l2, l3) {
  return [l1, l2, l3].map((level, index) => `
    <div class="roadmap-level">
      <span class="level-badge l${index + 1}">Level ${index + 1} - ${index === 0 ? "Aware" : index === 1 ? "Practitioner" : "Lead/Architect"}</span>
      <h3>${level[0]}</h3>
      <ul>${level[1].map(item => `<li>${item}</li>`).join("")}</ul>
    </div>
    ${index < 2 ? `<hr class="roadmap-divider" />` : ""}
  `).join("");
}

function renderSidebar() {
  const list = document.getElementById("topicList");
  list.innerHTML = TOPICS.map((t, i) => `
    <div class="topic-item${i === currentTopic ? " active" : ""}${viewedSet.has(i) ? " viewed" : ""}" onclick="loadTopic(${i})" data-title="${t.title.toLowerCase()}">
      <div class="topic-num">${String(i + 1).padStart(2, "0")}</div>
      <div class="topic-title-text">${t.title}</div>
    </div>
  `).join("");
  document.getElementById("viewedNum").textContent = viewedSet.size;
}

function loadTopic(idx) {
  currentTopic = idx;
  currentTab = "notes";
  viewedSet.add(idx);
  renderSidebar();

  const t = TOPICS[idx];
  document.getElementById("topicTitle").textContent = t.title;
  document.getElementById("topicSubtitle").textContent = t.subtitle;
  document.getElementById("currentNum").textContent = idx + 1;

  document.getElementById("infoCounts").innerHTML =
    `<b>3</b> roadmap levels | <b>${t.flashcards.length}</b> flashcards | <b>${t.mcqs.length}</b> MCQs | <b>${t.qa.length}</b> mock Q&A | <b>${t.code.length}</b> code snippets`;

  document.getElementById("prevBtn").disabled = idx === 0;
  document.getElementById("nextBtn").disabled = idx === TOPICS.length - 1;

  renderTabs();
  renderPanel(t, "notes");
  document.getElementById("mainContent").scrollTop = 0;
}

function renderTabs() {
  const bar = document.getElementById("tabBar");
  bar.innerHTML = TAB_KEYS.map(k => `
    <div class="tab${k === currentTab ? " active" : ""}" onclick="switchTab('${k}')">${TAB_LABELS[k]}</div>
  `).join("");
}

function switchTab(key) {
  currentTab = key;
  renderTabs();
  renderPanel(TOPICS[currentTopic], key);
}

function renderPanel(t, key) {
  const area = document.getElementById("tabContent");
  switch (key) {
    case "notes": area.innerHTML = `<div class="notes-body">${t.notes}</div>`; break;
    case "roadmap": area.innerHTML = `<div>${t.roadmap}</div>`; break;
    case "flashcards": area.innerHTML = renderFlashcards(t.flashcards); break;
    case "mcqs": area.innerHTML = renderMCQs(t.mcqs); break;
    case "qa": area.innerHTML = renderQA(t.qa); break;
    case "code": area.innerHTML = renderCode(t.code); break;
  }
}

function renderFlashcards(cards) {
  return `<div class="flashcard-grid">` + cards.map(c => `
    <div class="flashcard" onclick="flipCard(this)">
      <div class="flashcard-inner">
        <div class="fc-front">
          <div class="fc-label">Question</div>
          <div class="fc-text">${c.q}</div>
          <div class="fc-hint">Click to reveal answer</div>
        </div>
        <div class="fc-back">
          <div class="fc-label">Answer</div>
          <div class="fc-text">${c.a}</div>
        </div>
      </div>
    </div>
  `).join("") + `</div>`;
}

function flipCard(el) { el.classList.toggle("flipped"); }

function renderMCQs(mcqs) {
  return mcqs.map((m, qi) => `
    <div class="mcq-item" id="mcq-${qi}">
      <div class="mcq-q"><b>Q${qi + 1}.</b> ${m.q}</div>
      <ul class="mcq-options">
        ${m.opts.map((o, oi) => `
          <li class="mcq-opt" id="mcq-${qi}-opt-${oi}" onclick="selectMCQ(${qi},${oi},${m.ans})">
            <span class="mcq-letter">${"ABCD"[oi]}.</span>
            <span>${o}</span>
          </li>
        `).join("")}
      </ul>
      <div class="mcq-explanation" id="mcq-${qi}-exp">${m.explanation}</div>
    </div>
  `).join("");
}

function selectMCQ(qi, selected, correct) {
  const opts = document.querySelectorAll(`#mcq-${qi} .mcq-opt`);
  opts.forEach(o => { o.classList.add("disabled"); o.onclick = null; });
  opts[selected].classList.add(selected === correct ? "correct" : "wrong");
  if (selected !== correct) opts[correct].classList.add("correct");
  document.getElementById(`mcq-${qi}-exp`).classList.add("show");
}

function renderQA(qa) {
  return qa.map((item, i) => `
    <div class="qa-item" id="qa-${i}">
      <div class="qa-question" onclick="toggleQA(${i})">
        <div>
          <span class="qa-tag">${item.tag}</span>
          <div class="qa-q-text">${item.q}</div>
        </div>
        <div class="qa-toggle">v</div>
      </div>
      <div class="qa-answer">${item.a}</div>
    </div>
  `).join("");
}

function toggleQA(i) {
  document.getElementById(`qa-${i}`).classList.toggle("open");
}

function renderCode(snippets) {
  return snippets.map(s => `
    <div class="code-block">
      <h3>${s.title}</h3>
      <p>${s.desc}</p>
      <pre>${s.snippet}</pre>
    </div>
  `).join("");
}

function navigate(dir) {
  const next = currentTopic + dir;
  if (next >= 0 && next < TOPICS.length) loadTopic(next);
}

function filterTopics(query) {
  const q = query.toLowerCase().trim();
  document.querySelectorAll(".topic-item").forEach(el => {
    const title = el.dataset.title || "";
    el.classList.toggle("hidden", q.length > 0 && !title.includes(q));
  });
}

document.getElementById("totalNum").textContent = TOPICS.length;
loadTopic(0);
</script>
