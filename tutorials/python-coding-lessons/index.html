notes: `<p>Python is an interpreted, dynamically typed language. You write readable code, run it with the Python interpreter, and use indentation to define blocks instead of braces. The first goal is to get comfortable reading and writing small scripts without fighting syntax.</p>
<div class="sh">Must know cold</div>
<ul>
  <li><strong>Execution:</strong> Run files with <code>python file.py</code>. Run quick snippets in the REPL with <code>python</code>.</li>
  <li><strong>Indentation:</strong> Blocks under <code>if</code>, <code>for</code>, <code>while</code>, <code>def</code>, and <code>class</code> must be indented consistently.</li>
  <li><strong>Comments:</strong> Use <code>#</code> for comments. Use docstrings for functions, classes, and modules.</li>
  <li><strong>Variables:</strong> Names bind to objects. You do not declare a variable type before assignment.</li>
  <li><strong>Truthiness:</strong> Empty strings, empty collections, <code>0</code>, and <code>None</code> evaluate as false.</li>
  <li><strong>Main guard:</strong> Use <code>if __name__ == "__main__":</code> when code should only run directly, not when imported.</li>
</ul>
<div class="sh">Interview signals</div>
<ul>
  <li>Explain code out loud before typing. Python interviews reward clarity and simple, correct logic.</li>
  <li>Use meaningful names. <code>counts</code> is better than <code>d</code> when storing frequencies.</li>
  <li>Test edge cases: empty input, one item, duplicates, negative values, and mixed casing.</li>
</ul>
<div class="callout info">Quick rule: If you can write a clear <code>if</code>, a clear loop, and a clear function, you can solve many beginner-to-intermediate Python interview tasks.</div>`,

title: "APIs, JSON, Async, and Concurrency",
sub: "Call APIs, parse JSON, understand sync versus async, and use concurrency safely.",
notes: `<p>Modern Python often talks to APIs and external services. For test automation, you may validate REST responses, poll jobs, upload files, or run tasks concurrently.</p>
<div class="sh">Must know cold</div>
<ul>
  <li><strong>HTTP basics:</strong> Methods include GET, POST, PUT, PATCH, DELETE. Status codes like 200, 201, 400, 401, 404, and 500 matter.</li>
  <li><strong>JSON:</strong> API responses commonly become Python dictionaries and lists.</li>
  <li><strong>requests:</strong> Common third-party library for synchronous HTTP calls.</li>
  <li><strong>asyncio:</strong> Python's async framework. Use <code>async def</code>, <code>await</code>, and tasks for IO-bound concurrency.</li>
  <li><strong>Threads:</strong> Useful for IO-bound work. CPU-bound work is limited by the GIL in standard CPython.</li>
  <li><strong>Processes:</strong> Useful for CPU-bound parallelism.</li>
</ul>

var cur = 0;
var tab = "notes";
var viewed = new Set();
var TABS = [
  {key: "notes", label: "Notes"},
  {key: "roadmap", label: "Roadmap"},
  {key: "flashcards", label: "Flashcards"},
  {key: "mcqs", label: "MCQs"},
  {key: "qa", label: "Mock Q&amp;A"},
  {key: "code", label: "Code"}
];

function escapeHTML(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function buildSidebar() {
  var html = "";
  for (var i = 0; i < T.length; i++) {
    var search = (T[i].title + " " + T[i].sub).toLowerCase();
    html += '<div class="topic-item' + (i === cur ? " active" : "") + (viewed.has(i) ? " viewed" : "") + '" '
      + 'onclick="loadTopic(' + i + ')" data-search="' + escapeHTML(search) + '">'
      + '<div class="t-num">' + (i < 9 ? "0" : "") + (i + 1) + '</div>'
      + '<div class="t-label">' + T[i].title + '</div></div>';
  }
  document.getElementById("topicList").innerHTML = html;
  document.getElementById("viewNum").textContent = viewed.size;
}

function loadTopic(index) {
  cur = index;
  tab = "notes";
  viewed.add(index);
  buildSidebar();

  var topic = T[index];
  document.getElementById("topicTitle").textContent = topic.title;
  document.getElementById("topicSub").textContent = topic.sub;
  document.getElementById("curNum").textContent = index + 1;

  document.getElementById("infoCounts").innerHTML =
    '<b>3</b> roadmap levels | <b>' + topic.flashcards.length + '</b> flashcards | <b>'
    + topic.mcqs.length + '</b> MCQs | <b>' + topic.qa.length + '</b> mock Q&amp;A | <b>'
    + topic.code.length + '</b> code snippets';

  document.getElementById("prevBtn").disabled = index === 0;
  document.getElementById("nextBtn").disabled = index === T.length - 1;
  buildTabs();
  showPanel(topic, "notes");
  document.getElementById("mainArea").scrollTop = 0;
}

function buildTabs() {
  var html = "";
  for (var i = 0; i < TABS.length; i++) {
    html += '<div class="tab' + (TABS[i].key === tab ? " active" : "") + '" onclick="switchTab(\'' + TABS[i].key + '\')">'
      + TABS[i].label + '</div>';
  }
  document.getElementById("tabBar").innerHTML = html;
}

function switchTab(key) {
  tab = key;
  buildTabs();
  showPanel(T[cur], key);
}

function showPanel(topic, key) {
  var area = document.getElementById("tabContent");
  if (key === "notes") area.innerHTML = '<div class="notes-body">' + topic.notes + '</div>';
  else if (key === "roadmap") area.innerHTML = topic.roadmap;
  else if (key === "flashcards") area.innerHTML = buildFlashcards(topic.flashcards);
  else if (key === "mcqs") area.innerHTML = buildMCQ(topic.mcqs);
  else if (key === "qa") area.innerHTML = buildQA(topic.qa);
  else if (key === "code") area.innerHTML = buildCode(topic.code);
}

function buildFlashcards(cards) {
  var html = '<div class="fc-grid">';
  for (var i = 0; i < cards.length; i++) {
    html += '<div class="fc" onclick="this.classList.toggle(\'open\')">'
      + '<div class="fc-lbl">Question</div><div class="fc-txt">' + cards[i].q + '</div>'
      + '<div class="fc-hint">Click to reveal answer &#8595;</div>'
      + '<div class="fc-ans"><div class="fc-lbl">Answer</div><div class="fc-txt">' + cards[i].a + '</div></div></div>';
  }
  return html + '</div>';
}

function buildMCQ(mcqs) {
  var html = "";
  for (var i = 0; i < mcqs.length; i++) {
    var item = mcqs[i];
    html += '<div class="mcq-item" id="mcq' + i + '"><div class="mcq-q"><b>Q' + (i + 1) + '.</b> ' + item.q + '</div><ul class="mcq-opts">';
    for (var j = 0; j < item.opts.length; j++) {
      html += '<li class="mcq-opt" onclick="pickMCQ(' + i + ',' + j + ',' + item.ans + ')">'
        + '<span class="mcq-ltr">' + "ABCD"[j] + '.</span><span>' + item.opts[j] + '</span></li>';
    }
    html += '</ul><div class="mcq-exp" id="exp' + i + '">' + item.exp + '</div></div>';
  }
  return html;
}

function pickMCQ(questionIndex, selected, answer) {
  var options = document.querySelectorAll("#mcq" + questionIndex + " .mcq-opt");
  for (var i = 0; i < options.length; i++) {
    options[i].classList.add("locked");
    options[i].onclick = null;
  }
  options[selected].classList.add(selected === answer ? "correct" : "wrong");
  if (selected !== answer) options[answer].classList.add("correct");
  document.getElementById("exp" + questionIndex).classList.add("show");
}

function buildQA(items) {
  var html = "";
  for (var i = 0; i < items.length; i++) {
    html += '<div class="qa-item" id="qa' + i + '">'
      + '<div class="qa-hd" onclick="toggleQA(' + i + ')">'
      + '<div><span class="qa-tag">' + items[i].tag + '</span>'
      + '<div class="qa-qtxt">' + items[i].q + '</div></div>'
      + '<div class="qa-arr">&#9660;</div></div>'
      + '<div class="qa-body">' + items[i].a + '</div></div>';
  }
  return html;
}

function toggleQA(index) {
  document.getElementById("qa" + index).classList.toggle("open");
}

function buildCode(snippets) {
  var html = "";
  for (var i = 0; i < snippets.length; i++) {
    html += '<div class="code-block"><h3>' + snippets[i].title + '</h3>'
      + '<p class="desc">' + snippets[i].desc + '</p>'
      + '<pre><code>' + escapeHTML(snippets[i].snippet) + '</code></pre></div>';
  }
  return html;
}

function navigate(direction) {
  var next = cur + direction;
  if (next >= 0 && next < T.length) loadTopic(next);
}

function filterTopics(query) {
  query = query.toLowerCase().trim();
  var items = document.querySelectorAll(".topic-item");
  for (var i = 0; i < items.length; i++) {
    items[i].classList.toggle("hidden", query && items[i].dataset.search.indexOf(query) === -1);
  }
}

document.getElementById("totNum").textContent = T.length;
loadTopic(0);
</script>
